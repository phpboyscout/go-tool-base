version: 2
project_name: gtb
force_token: gitlab
before:
  hooks:
    - go mod tidy
    - go generate ./... ./cli/...

builds:
  - id: gtb-darwin
    main: ./cli/cmd/gtb
    env:
      - CGO_ENABLED=0
      - GOLANG_FIPS=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X gitlab.com/phpboyscout/go-tool-base/cli/pkg/version.version={{.Version}} -X gitlab.com/phpboyscout/go-tool-base/cli/pkg/version.commit={{.Commit}} -X gitlab.com/phpboyscout/go-tool-base/cli/pkg/version.date={{.Date}}
      - -X gitlab.com/phpboyscout/go-tool-base/cli/pkg/cmd/root.otelAuth={{.Env.GTB_OTEL_AUTH}}
    # Run the binary once before anything is published: a release whose
    # binary cannot start (a link file left out of the build, a feature
    # enabled with no adapter) shipped green from a pipeline that never ran
    # it, and a broken install cannot self-update out of that (#95). Only
    # the target that matches the runner is executable here; the rest pass.
    hooks:
      post:
        - cmd: sh -c 'case "{{ .Os }}/{{ .Arch }}" in "{{ .Runtime.Goos }}/{{ .Runtime.Goarch }}") "{{ .Path }}" version --ci >/dev/null ;; esac'
  - id: gtb
    main: ./cli/cmd/gtb
    env:
      - CGO_ENABLED=0
      - GOLANG_FIPS=1
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X gitlab.com/phpboyscout/go-tool-base/cli/pkg/version.version={{.Version}} -X gitlab.com/phpboyscout/go-tool-base/cli/pkg/version.commit={{.Commit}} -X gitlab.com/phpboyscout/go-tool-base/cli/pkg/version.date={{.Date}}
      - -X gitlab.com/phpboyscout/go-tool-base/cli/pkg/cmd/root.otelAuth={{.Env.GTB_OTEL_AUTH}}
    # Run the binary once before anything is published: a release whose
    # binary cannot start (a link file left out of the build, a feature
    # enabled with no adapter) shipped green from a pipeline that never ran
    # it, and a broken install cannot self-update out of that (#95). Only
    # the target that matches the runner is executable here; the rest pass.
    hooks:
      post:
        - cmd: sh -c 'case "{{ .Os }}/{{ .Arch }}" in "{{ .Runtime.Goos }}/{{ .Runtime.Goarch }}") "{{ .Path }}" version --ci >/dev/null ;; esac'

notarize:
  macos:
    - enabled: '{{ isEnvSet "APPLE_DEV_CERT" }}'
      ids:
        - gtb-darwin
      sign:
        certificate: "{{.Env.APPLE_DEV_CERT}}"
        password: "{{.Env.APPLE_DEV_CERT_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.APPLE_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.APPLE_NOTARY_KEY_ID}}"
        key: "{{.Env.APPLE_NOTARY_KEY}}"

archives:
  # Single archive covering both darwin and linux/windows builds.
  # The OS keychain backend now lives in its own module
  # (pkg/credentials/keychain) that cmd/gtb does not import, so the
  # shipped binary uses the stub credentials backend and performs no
  # session-bus / keychain IPC — the regulated-deployment default.
  # Downstream tools that want keychain support import the subpackage
  # in their own cmd package.
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
sboms:
  - artifacts: archive

# Pin the checksums manifest filename so pkg/setup's Update() path
# finds it via the default asset-list lookup. GoReleaser v2's default
# is "{{ .ProjectName }}_{{ .Version }}_checksums.txt", which the
# spec's default lookup name ("checksums.txt") does not match.
# https://gitlab.com/phpboyscout/go-tool-base/-/wikis/specs/0056-remote-update-checksum-verification
# describes the contract.
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Detached, ASCII-armored OpenPGP signature over checksums.txt
# (-> checksums.txt.sig), consumed by self-update signature verification
# in pkg/setup.
#
# Live, and not gated. scripts/sign-release.sh signs via `gtb sign
# --backend aws-kms` using the OIDC role the goreleaser job assumes, and
# it EXITS NON-ZERO when no AWS credentials resolve rather than letting an
# unsigned release through. There is no --skip=sign branch and no
# GTB_SIGNING_KEY variable; both were described here long after they
# stopped existing.
#
# See docs/how-to/secure-releases.md for the key variables.
signs:
  - id: checksums
    cmd: scripts/sign-release.sh
    # The R2 keys the process carries for `blobs` outrank the OIDC identity in
    # the SDK's chain, so they are blanked for the signer (0025 D15).
    env:
      - "AWS_ACCESS_KEY_ID="
      - "AWS_SECRET_ACCESS_KEY="
    artifacts: checksum
    signature: "${artifact}.sig"
    args: ["${artifact}", "${signature}"]
    output: true

# goreleaser BUILDS and UPLOADS; it does not own the release.
#
# It can only run after a tag, so a release created at tagging time is created
# before its binaries exist -- and a release that exists with nothing on it
# answers "yes" to the only question a consumer knows how to ask. colophon
# creates it on the tag pipeline instead, carrying links to what was uploaded
# here. See colophon's explanation/concepts/complete-releases.md.
#
# `disable` rather than `skip_upload`: the upload still happens, through the
# pipe below, which needs no release. That independence is the mechanism.
release:
  disable: true

# The release store (colophon spec 0025). `directory` is the tag and must agree
# with the cicd colophon component's `asset_base` and the cask URL below:
# written three times on purpose, so a mismatch is a visible configuration
# error rather than a release full of 404s (v0.41.1 was one). SBOMs, checksums
# and signatures are release-uploadable types, so they travel without an
# extra_files glob. Every object is write-once, hence immutable (0025 D18).
blobs:
  - provider: s3
    bucket: pbs-release-binaries
    endpoint: "{{ .Env.R2_RELEASE_ENDPOINT }}"
    region: auto
    directory: "go-tool-base/{{ .Tag }}"
    s3_force_path_style: true
    content_disposition: inline
    cache_control:
      - "public, max-age=31536000, immutable"

changelog:
  # colophon owns the changelog (CHANGELOG.md and the Release notes), so
  # GoReleaser does not generate its own.
  disable: true
gitlab_urls:
  api: https://gitlab.com/api/v4/
  download: https://gitlab.com/
  use_package_registry: true
  use_job_token: true
  skip_tls_verify: false
snapshot:
  version_template: "{{ incpatch .Version }}-dev{{.ShortCommit}}"

# Homebrew cask published to the GitLab-hosted tap at
# gitlab.com/phpboyscout/homebrew (mirrored from the previous GitHub
# tap during the GitLab migration). Auth via HOMEBREW_TAP_GITLAB_TOKEN
# CI variable scoped to the tap repo only — a separate token from
# GITLAB_TOKEN so a compromise of one cannot cross to the other.
homebrew_casks:
  # binary: is deprecated in favour of binaries:, and is omitted rather than
  # migrated — unset, GoReleaser defaults binaries to [name], which is already
  # "gtb". conflicts: is dropped entirely: it declared a conflict with a *gtb
  # formula*, and no such formula exists in this tap (Casks/ only) or in
  # homebrew-core. HomebrewCaskConflict.Formula is deprecated by homebrew in
  # any case; the replacement field is cask:, which here would only have made
  # the cask conflict with itself.
  - name: gtb
    commit_author:
      name: goreleaserbot
      email: matt@phpboyscout.com
    # commit_msg_template is deliberately unset. GoReleaser's default for a cask
    # is "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"; the
    # override that used to sit here was the *formula* default, so every tap
    # commit called this a formula.
    homepage: "https://gitlab.com/phpboyscout/go-tool-base"
    description: "A helper utility for interacting and managing gtb repos and resources"
    # With release.disable the cask cannot derive its download URL from a
    # release GoReleaser did not create, so it names the release store the
    # blobs: block writes to. The v0.41.0 tag was the first to run with a
    # disabled release and failed on exactly this ("release is disabled,
    # cannot use default url_template").
    url:
      template: "https://pkg.phpboyscout.uk/go-tool-base/{{ .Tag }}/{{ .ArtifactName }}"
    dependencies:
      - formula: go
      - formula: golangci-lint
    repository:
      owner: phpboyscout
      name: homebrew
      branch: main
      # GoReleaser has no native GitLab API path for homebrew tap
      # pushes (the `token:` field is GitHub-only). Push over SSH
      # using a deploy key registered on the tap repo with
      # write_access. The private key lives in the
      # HOMEBREW_TAP_SSH_KEY masked CI variable.
      git:
        url: "git@gitlab.com:phpboyscout/homebrew.git"
        private_key: "{{ .Env.HOMEBREW_TAP_SSH_KEY }}"
