version: 2
project_name: gtb
force_token: gitlab
before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: gtb-darwin
    main: ./cmd/gtb
    env:
      - CGO_ENABLED=0
      - GOLANG_FIPS=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X gitlab.com/phpboyscout/go-tool-base/internal/version.version={{.Version}} -X gitlab.com/phpboyscout/go-tool-base/internal/version.commit={{.Commit}} -X gitlab.com/phpboyscout/go-tool-base/internal/version.date={{.Date}}
      - -X gitlab.com/phpboyscout/go-tool-base/internal/cmd/root.otelAuth={{.Env.GTB_OTEL_AUTH}}
  - id: gtb
    main: ./cmd/gtb
    env:
      - CGO_ENABLED=0
      - GOLANG_FIPS=1
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X gitlab.com/phpboyscout/go-tool-base/internal/version.version={{.Version}} -X gitlab.com/phpboyscout/go-tool-base/internal/version.commit={{.Commit}} -X gitlab.com/phpboyscout/go-tool-base/internal/version.date={{.Date}}
      - -X gitlab.com/phpboyscout/go-tool-base/internal/cmd/root.otelAuth={{.Env.GTB_OTEL_AUTH}}

notarize:
  macos:
    - enabled: '{{ isEnvSet "APPLE_DEV_CERT" }}'
      ids:
        - gtb-darwin
      sign:
        certificate: "{{.Env.APPLE_DEV_CERT}}"
        password: "{{.Env.APPLE_DEV_CERT_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.APPLE_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.APPLE_NOTARY_KEY_ID}}"
        key: "{{.Env.APPLE_NOTARY_KEY}}"

archives:
  # Single archive covering both darwin and linux/windows builds.
  # The OS keychain backend now lives in its own module
  # (pkg/credentials/keychain) that cmd/gtb does not import, so the
  # shipped binary uses the stub credentials backend and performs no
  # session-bus / keychain IPC — the regulated-deployment default.
  # Downstream tools that want keychain support import the subpackage
  # in their own cmd package.
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
sboms:
  - artifacts: archive

# Pin the checksums manifest filename so pkg/setup's Update() path
# finds it via the default asset-list lookup. GoReleaser v2's default
# is "{{ .ProjectName }}_{{ .Version }}_checksums.txt", which the
# spec's default lookup name ("checksums.txt") does not match.
# docs/development/specs/2026-04-02-remote-update-checksum-verification.md
# describes the contract.
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  use_existing_draft: true
  replace_existing_artifacts: true
  make_latest: true
  mode: replace
changelog:
  use: "gitlab"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?(bug|fix)(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
gitlab_urls:
  api: https://gitlab.com/api/v4/
  download: https://gitlab.com/
  use_package_registry: true
  use_job_token: true
  skip_tls_verify: false
snapshot:
  version_template: "{{ incpatch .Version }}-dev{{.ShortCommit}}"

# Homebrew tap distribution was previously published to a GitHub-hosted
# tap repo via the HOMEBREW_TAP_GITHUB_TOKEN secret. Removed from this
# release pipeline as part of the GitHub → GitLab migration —
# docs/development/gitlab-migration-followups.md tracks the decision
# (drop entirely, move tap to GitLab, or maintain a separate
# GitHub-hosted tap). Re-add this block once the decision lands.
