# gitleaks configuration
#
# Extends the default ruleset shipped with gitleaks and adds a
# file-scoped allowlist for intentional test fixtures. The redactor in
# pkg/redact has a test corpus that *must* contain credential-shaped
# strings (URLs with userinfo, OpenAI-style sk- prefixes, Authorization
# header samples) because those are the inputs its golden tests verify
# get stripped. Scanning these files as leaked secrets is a false
# positive that blocks every PR touching the package.
#
# Uses the top-level [allowlist] (singular) form for compatibility
# with the gitleaks-action v2.3.9 bundled binary.

[extend]
useDefault = true

[allowlist]
description = "pkg/redact and internal/agent redaction tests intentionally contain credential-shaped inputs for the redactor to strip (the tests assert these tokens do NOT survive); the doctor report support-bundle tests and feature do the same (asserting the bundle redacts seeded credential-shaped config values); component docs carry the same illustrative strings; and the keys command's unit test plus its spec doc carry a throwaway generated private key / illustrative PEM example; and the Ed25519/KMS signing design spec cites public AWS KMS key-spec constants (e.g. ECC_NIST_EDWARDS25519) and illustrative key ARNs/aliases that generic-api-key flags in a `key:`-adjacent context. None are real leaked secrets."
paths = [
    '''pkg/redact/redact_test\.go''',
    '''pkg/redact/redact_fuzz_test\.go''',
    '''pkg/telemetry/telemetry_test\.go''',
    '''pkg/cmd/doctor/report_test\.go''',
    '''docs/explanation/components/redact\.md''',
    '''docs/explanation/components/telemetry\.md''',
    '''docs/explanation/components/telemetry/.*\.md''',
    '''docs/explanation/concepts/telemetry\.md''',
    '''internal/cmd/keys/keys_test\.go''',
    '''docs/development/specs/2026-06-08-keys-mint-command\.md''',
    '''features/cli/keys\.feature''',
    '''features/cli/doctor-report\.feature''',
    '''internal/agent/tools_security_test\.go''',
    '''docs/development/specs/2026-07-28-ed25519-kms-signing\.md''',
]

# The telemetry/redact docs carry a deliberately realistic example token in a
# redaction demo (shown being stripped). gitleaks scans full git history, so the
# example trips generic-api-key across every historical path it has lived at
# (telemetry.md, the telemetry/ subsection, the reference/api/concepts variants).
# Allowlist the fake token itself — a real key would never be "abc123def456" — so
# the suppression is precise and path-independent.
regexes = [
    '''sk-proj-abc123def456''',
]
