# gitleaks configuration
#
# Extends the default ruleset shipped with gitleaks and adds a
# file-scoped allowlist for intentional test fixtures. The redactor in
# pkg/redact has a test corpus that *must* contain credential-shaped
# strings (URLs with userinfo, OpenAI-style sk- prefixes, Authorization
# header samples) because those are the inputs its golden tests verify
# get stripped. Scanning these files as leaked secrets is a false
# positive that blocks every PR touching the package.
#
# Uses the top-level [allowlist] (singular) form for compatibility
# with the gitleaks-action v2.3.9 bundled binary.

[extend]
useDefault = true

[allowlist]
description = "pkg/redact and internal/agent redaction tests intentionally contain credential-shaped inputs for the redactor to strip (the tests assert these tokens do NOT survive); component docs carry the same illustrative strings; pkg/openapi vendors the minified Stoplight Elements UI (a third-party library whose tokenised minified code trips generic-api-key); and the keys command's unit test plus its spec doc carry a throwaway generated private key / illustrative PEM example. None are real leaked secrets."
paths = [
    '''pkg/redact/redact_test\.go''',
    '''pkg/redact/redact_fuzz_test\.go''',
    '''pkg/telemetry/telemetry_test\.go''',
    '''docs/components/redact\.md''',
    '''docs/components/telemetry\.md''',
    '''pkg/openapi/assets/web-components\.min\.js''',
    '''pkg/openapi/assets/styles\.min\.css''',
    '''internal/cmd/keys/keys_test\.go''',
    '''docs/development/specs/2026-06-08-keys-mint-command\.md''',
    '''features/cli/keys\.feature''',
    '''internal/agent/tools_security_test\.go''',
]
