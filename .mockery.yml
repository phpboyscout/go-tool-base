all: true
dir: mocks/{{ .InterfaceDirRelative }}
filename: "{{.InterfaceName}}.go"
force-file-write: true
formatter: goimports
include-auto-generated: false
inpackage: false
log-level: info
structname: "{{.Mock}}{{.InterfaceName}}"
pkgname: "{{.SrcPackageName}}"
recursive: true
require-template-schema-exists: true
template: testify
template-schema: "{{.Template}}.schema.json"
packages:
  gitlab.com/phpboyscout/go-tool-base/pkg:
    config:
      all: true
  # The chat client interfaces were extracted to the standalone go/chat module.
  # GTB tests only need a ChatClient mock, so point mockery at the module for
  # that one interface (output kept at mocks/pkg/chat so the import path and
  # package name are unchanged) rather than hand-maintaining the generated file.
  gitlab.com/phpboyscout/go/chat:
    config:
      all: false
      dir: mocks/pkg/chat
      pkgname: chat
    interfaces:
      ChatClient:
