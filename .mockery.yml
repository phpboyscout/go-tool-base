all: false
dir: mocks/{{ .InterfaceDirRelative }}
filename: "{{.InterfaceName}}.go"
force-file-write: true
formatter: goimports
include-auto-generated: false
inpackage: false
log-level: info
structname: "{{.Mock}}{{.InterfaceName}}"
pkgname: "{{.SrcPackageName}}"
recursive: true
require-template-schema-exists: true
template: testify
template-schema: "{{.Template}}.schema.json"
packages:
  # Only the interfaces a test actually constructs. `all: true` over pkg/
  # regenerated mocks for interfaces that had already left the tree, and a
  # generated mock never names what it mocks, so the graveyard compiled
  # forever. internal/repopolicy fails the suite if a mock goes unused.
  gitlab.com/phpboyscout/go-tool-base/pkg/setup:
    config:
      all: false
    interfaces:
      Editor:
  # ChatClient was extracted to go/chat; the mock stays at mocks/pkg/chat so
  # the import path and package name are unchanged.
  gitlab.com/phpboyscout/go/chat:
    config:
      all: false
      dir: mocks/pkg/chat
      pkgname: chat
    interfaces:
      ChatClient:
