version: 2
project_name: {{ .Name | escapeYAML }}
{{ if .Hosted -}}
force_token: {{ .ForgeTokenType }}
{{ end -}}
before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: ./cmd/{{ .Name }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      # Rewrites file paths in stack traces to be module-relative, so a trace a
      # user pastes reads "example.com/mod@v1.2.3/file.go:42" rather than naming
      # the directory the release happened to be built in.
      - -trimpath
    ldflags:
      - -s -w
      - -X {{ .ModulePath }}/internal/version.version={{ "{{" }}.Version{{ "}}" }}
      - -X {{ .ModulePath }}/internal/version.commit={{ "{{" }}.Commit{{ "}}" }}
      - -X {{ .ModulePath }}/internal/version.date={{ "{{" }}.Date{{ "}}" }}
    # Run the binary once before anything is published: a release whose
    # binary cannot start (a link file left out of the build, a feature
    # enabled with no adapter) ships green from a pipeline that never ran it,
    # and a broken install cannot self-update out of that. Only the target
    # that matches the runner is executable here; the rest pass.
    hooks:
      post:
        - cmd: sh -c 'case "{{ "{{" }} .Os {{ "}}" }}/{{ "{{" }} .Arch {{ "}}" }}" in "{{ "{{" }} .Runtime.Goos {{ "}}" }}/{{ "{{" }} .Runtime.Goarch {{ "}}" }}") "{{ "{{" }} .Path {{ "}}" }}" version --ci >/dev/null ;; esac'

archives:
  - formats: [ "tar.gz" ]
    name_template: >-
      {{ "{{" }} .ProjectName {{ "}}" }}_
      {{ "{{" }}- title .Os {{ "}}" }}_
      {{ "{{" }}- if eq .Arch "amd64" {{ "}}" }}x86_64
      {{ "{{" }}- else if eq .Arch "386" {{ "}}" }}i386
      {{ "{{" }}- else {{ "}}" }}{{ "{{" }} .Arch {{ "}}" }}{{ "{{" }} end {{ "}}" }}
      {{ "{{" }}- if .Arm {{ "}}" }}v{{ "{{" }} .Arm {{ "}}" }}{{ "{{" }} end {{ "}}" }}

{{ if .Hosted -}}
release:
  use_existing_draft: true
  replace_existing_artifacts: true
  make_latest: true
  # releaser-pleaser creates the Release (with its changelog) when the
  # Release PR/MR is merged; this job only attaches the build artefacts.
  mode: keep-existing
{{ else -}}
release:
  # Not hosted on a forge: there is no release object to create. The
  # binaries are published by the blobs pipe below.
  disable: true
{{ end -}}

checksum:
  name_template: 'checksums.txt'

{{ if and .Signing.Enabled .Signing.KeyID -}}
# Release signing: gtb enable signing wired this. The signature over
# checksums.txt is what the self-updater's embedded trust anchor verifies.
# gtb is called directly (no shim); AWS credentials come from the CI OIDC
# context, and goreleaser runs with --skip=sign when there isn't one.
signs:
  - id: checksums
    cmd: gtb
    args:
      - "--ci"
      - "sign"
      - "--backend"
      - {{ .Signing.Backend | escapeYAML }}
      {{- if eq .Signing.Backend "aws-kms" }}
      - "--kms-region"
      - {{ .Signing.KMSRegion | escapeYAML }}
      {{- end }}
      - "--key-id"
      - {{ .Signing.KeyID | escapeYAML }}
      - "--public-key"
      - {{ .Signing.PublicKey | escapeYAML }}
      - "--output"
      - "${signature}"
      - "${artifact}"
    artifacts: checksum
    signature: "${artifact}.sig"
    output: true

{{ end -}}
snapshot:
  version_template: "{{ "{{" }} incpatch .Version {{ "}}" }}-dev{{ "{{" }}.ShortCommit{{ "}}" }}"

changelog:
  # releaser-pleaser owns the changelog and Release notes.
  disable: true

{{ if .StaticChannel -}}
# The static release channel (go-tool-base spec 0203 D5). The tool discovers
# and retrieves its releases from {{ .ReleaseBaseURL }}: a per-tag
# release.json beside the binaries and one pointer, latest.json, at the base.
# Three pieces, in pipeline order. They need goreleaser Pro: before_publish is
# the one slot that runs after checksums and signatures exist and before
# anything is uploaded.
#
#   1. before_publish writes dist/release.json and dist/latest.json from
#      metadata.json, checksums.txt and the archives themselves. Filtered to
#      the checksum artifact so it runs once.
#   2. blobs uploads the tag's objects, release.json among them
#      (extra_files), to an S3-compatible store. RELEASE_STORE_ENDPOINT and
#      RELEASE_STORE_BUCKET name the store; AWS_ACCESS_KEY_ID and
#      AWS_SECRET_ACCESS_KEY are its credentials. The public base URL above
#      must serve the bucket's "{{ .ReleaseBasePath }}/" prefix.
#   3. publishers, last in the publish pipe and skipped with it, moves the
#      pointer by a conditional write (scripts/move-pointer.sh). A publisher
#      runs once by naming an id no archive carries: the checksum artifact
#      belongs to every id.
#
# The layout a reader expects: docs/reference/static-release-channel.md in
# go-tool-base.
before_publish:
  - cmd: go tool releasemanifest --dist dist --base-url {{ .ReleaseBaseURL }}
    artifacts: [checksum]
    output: true

blobs:
  - provider: s3
    bucket: "{{ "{{" }} .Env.RELEASE_STORE_BUCKET {{ "}}" }}"
    endpoint: "{{ "{{" }} .Env.RELEASE_STORE_ENDPOINT {{ "}}" }}"
    region: auto
    directory: "{{ .ReleaseBasePath }}/{{ "{{" }} .Tag {{ "}}" }}"
    s3_force_path_style: true
    content_disposition: inline
    cache_control:
      - "public, max-age=31536000, immutable"
    extra_files:
      - glob: dist/release.json

publishers:
  - name: latest-pointer
    checksum: true
    ids: [latest-pointer]
    cmd: bash scripts/move-pointer.sh dist/latest.json {{ "{{" }} .Env.RELEASE_STORE_ENDPOINT {{ "}}" }}/{{ "{{" }} .Env.RELEASE_STORE_BUCKET {{ "}}" }}/{{ .ReleaseBasePath }}/latest.json
    output: true

{{ end -}}
{{ if not .Hosted -}}
{{ else if eq .ForgeTokenType "github" -}}
github_urls:
  api: https://{{ .Host }}/api/v3/
  upload: https://{{ .Host }}/api/uploads/
  download: https://{{ .Host }}/
  skip_tls_verify: false
{{ else -}}
gitlab_urls:
  api: https://{{ .Host }}/api/v4/
  download: https://{{ .Host }}/
  skip_tls_verify: false
{{ end -}}