# .gitlab-ci.yml — pipeline assembled from phpboyscout/cicd components.
#
#   merge_request_event → lint, test, security        (the merge gate)
#   tag v*.*.*          → goreleaser, pages docs       (the release fan-out)
#   default branch      → colophon, zensical-pages deploy
#
# Quality gates live exclusively at the MR level. Pushing to the default
# branch runs nothing except colophon, which keeps a release MR up to date
# (and that MR gets the full gate), so by the time anything lands it has
# already been vetted. When the release MR merges, colophon tags the commit
# that actually landed on the default branch and creates the release;
# goreleaser and the zensical-pages deploy fire from that tag, so the docs
# site always corresponds to a real tagged release.
#
# Project setting prerequisites (configure these on the GitLab project before
# the pipeline can function):
#   • COLOPHON_TOKEN: a project or group access token with the api and
#     write_repository scopes, set as a CI/CD variable. colophon uses it to
#     open the release MR and push the tag. It must not be CI_JOB_TOKEN: a tag
#     pushed with the job token does not start the tag pipeline that builds
#     the release. If v* tags are protected, the token must be allowed to
#     create them.
#   • Merge method: fast-forward. colophon resolves the commit that landed
#     rather than trusting the MR's recorded head, so rebasing on merge is
#     safe; meaningful commits should survive rather than be squashed.
#   • Pipelines must succeed (so the MR gates actually block merge).
#
# Release notes come from conventional commits. Prose for a release goes in a
# Release-Note: trailer or a fenced release-note block in a commit message,
# and overrides (a forced version, a hold) go in .colophon.yaml; nothing
# written in the release MR's description survives, because colophon
# regenerates it on every run.
#
# The phpboyscout/cicd components are version-pinned below. Renovate keeps the
# pins current via the cicd preset extended in renovate.json5 — run by the
# group-wide autodiscover bot, so this project needs no Renovate job or
# schedule of its own. Bump deliberately through the Renovate MRs rather than
# floating the tags.

include:
  # Quality gates — MR-only by default. Toolchain images are left at the
  # component defaults; let Renovate/cicd carry the toolchain rather than
  # pinning point-in-time overrides here.
  - component: {{ .CIComponentSource }}/go-lint@{{ .CICDComponentVersion }}
  - component: {{ .CIComponentSource }}/go-test@{{ .CICDComponentVersion }}
    inputs:
      enable_e2e: {{ .CIEnableE2E }}
  - component: {{ .CIComponentSource }}/go-security@{{ .CICDComponentVersion }}

  # Release — tag-gated goreleaser + default-branch zensical-pages deploy.
{{- if .StaticChannel }}
  # pro: the static release channel's manifest is written by a before_publish
  # hook (go-tool-base spec 0203 D5), a Pro-only slot; the licence is the
  # GORELEASER_KEY CI/CD variable.
  - component: {{ .CIComponentSource }}/goreleaser@{{ .CICDComponentVersion }}
    inputs:
      pro: true
{{- else }}
  - component: {{ .CIComponentSource }}/goreleaser@{{ .CICDComponentVersion }}
{{- end }}
  - component: {{ .CIComponentSource }}/zensical-pages@{{ .CICDComponentVersion }}

  # Release MR machinery: colophon proposes the release MR on the default
  # branch, and tags and creates the release when it merges. token
  # ($COLOPHON_TOKEN), branch (main) and stage (release) are the component
  # defaults.
  - component: {{ .CIComponentSource }}/colophon@{{ .CICDComponentVersion }}

stages:
  - lint
  - test
  - security
  - release
  - pages

# Pipeline-source gating: MR pipelines are primary; tag pipelines run the
# release fan-out; default-branch pipelines exist only so colophon can
# maintain its MR. The `never` rule suppresses duplicate branch pipelines when
# a feature branch already has an open MR (otherwise every push to a branch
# with an open MR would build twice).
#
# That rule MUST be guarded on $CI_COMMIT_BRANCH. Keying it on
# `$CI_PIPELINE_SOURCE == "push"` instead also matches TAG pipelines — a tag
# push is a push — so the release fan-out is silently suppressed whenever any
# MR happens to be open. See phpboyscout/cicd issue #2.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

variables:
  # colophon + goreleaser walk the full commit history.
  GIT_DEPTH: "0"
{{- if .StaticChannel }}

# The static release channel's store (go-tool-base spec 0203 D5). The
# goreleaser component hands the job the estate store's credentials as
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY; these two name the S3 endpoint
# and bucket .goreleaser.yaml uploads to and moves the pointer on. Change
# them for a store of your own, and make sure {{ .ReleaseBaseURL }}
# serves the bucket's "{{ .ReleaseBasePath }}/" prefix.
goreleaser:
  variables:
    RELEASE_STORE_ENDPOINT: $R2_RELEASE_ENDPOINT
    RELEASE_STORE_BUCKET: pbs-release-binaries
{{- end }}
