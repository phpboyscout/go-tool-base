name: goreleaser

on:
  push:
    tags:
      - "v*"
  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "reopened"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.15.1
      - name: Install documentation tools
        run: pip install zensical
      - if: ${{ "{{" }} !startsWith(github.ref, 'refs/tags/v') {{ "}}" }}
        run: echo "flags=--snapshot{{ if .Signing.SignsReleases }} --skip=sign{{ end }}" >> $GITHUB_ENV
{{- if .Signing.SignsReleases }}

      # The signs block in .goreleaser.yaml calls gtb. Only a release signs.
      - name: Install gtb
        if: ${{ "{{" }} startsWith(github.ref, 'refs/tags/v') {{ "}}" }}
        run: go install {{ .GTBInstallPackage }}
{{- end }}
{{- if .Signing.SignsWithKMS }}

      # SIGNER_ROLE_ARN is a repository variable naming the KMS signer role.
      - name: Assume the signer role
        if: ${{ "{{" }} startsWith(github.ref, 'refs/tags/v') {{ "}}" }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ "{{" }} vars.SIGNER_ROLE_ARN {{ "}}" }}
          aws-region: {{ .Signing.KMSRegion | escapeYAML }}
          audience: sts.amazonaws.com
{{- end }}

      - name: Run GoReleaser ${{ "{{" }} env.flags {{ "}}" }}
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ "{{" }} secrets.GITHUB_TOKEN {{ "}}" }}
{{- if .HomebrewCask }}
          # The Homebrew cask (go-tool-base spec 0212). HOMEBREW_TAP_TOKEN is a
          # token that can write to the tap and nothing else. The APPLE_*
          # secrets are optional: with them the macOS binaries are notarised,
          # and without them macOS may refuse to open them.
          HOMEBREW_TAP_TOKEN: ${{ "{{" }} secrets.HOMEBREW_TAP_TOKEN {{ "}}" }}
          APPLE_DEV_CERT: ${{ "{{" }} secrets.APPLE_DEV_CERT {{ "}}" }}
          APPLE_DEV_CERT_PASSWORD: ${{ "{{" }} secrets.APPLE_DEV_CERT_PASSWORD {{ "}}" }}
          APPLE_NOTARY_ISSUER_ID: ${{ "{{" }} secrets.APPLE_NOTARY_ISSUER_ID {{ "}}" }}
          APPLE_NOTARY_KEY_ID: ${{ "{{" }} secrets.APPLE_NOTARY_KEY_ID {{ "}}" }}
          APPLE_NOTARY_KEY: ${{ "{{" }} secrets.APPLE_NOTARY_KEY {{ "}}" }}
{{- end }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ "{{" }} env.flags {{ "}}" }}

      # Upload PR artifacts if on a PR branch
      - name: Upload PR artifacts
        if: ${{ "{{" }} github.event_name == 'pull_request' {{ "}}" }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-binaries-${{ "{{" }} github.event.number {{ "}}" }}
          path: dist/**
          if-no-files-found: error
          retention-days: 7
