# releaser-pleaser drives releases via the Release-MR pattern: on main it
# maintains a "Release" MR with the pending version bump + changelog;
# merging it creates the tag and GitLab Release, which triggers the
# goreleaser job (.gitlab/ci/release.yml) to attach binaries.
#
# Requires a RELEASER_PLEASER_TOKEN CI/CD variable: a project access token
# with Maintainer role and scopes api, read_repository, write_repository.
# The project must also use fast-forward + squash merges. The component
# does not support floating tags — pin the full version.
include:
  - local: .gitlab/ci/test.yml
  - local: .gitlab/ci/lint.yml
  - local: .gitlab/ci/release.yml
  - local: .gitlab/ci/pages.yml
  - component: $CI_SERVER_FQDN/apricote/releaser-pleaser/run@v0.8.0
    inputs:
      token: $RELEASER_PLEASER_TOKEN
      branch: main
      stage: release

stages:
  - test
  - lint
  - release
  - pages
