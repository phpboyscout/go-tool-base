version: 2
project_name: {{ .Name | escapeYAML }}
force_token: {{ .ReleaseProvider }}
before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: cmd/{{ .Name }}/main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X {{ .ModulePath }}/internal/version.version={{ "{{" }}.Version{{ "}}" }}
      - -X {{ .ModulePath }}/internal/version.commit={{ "{{" }}.Commit{{ "}}" }}
      - -X {{ .ModulePath }}/internal/version.date={{ "{{" }}.Date{{ "}}" }}

archives:
  - formats: [ "tar.gz" ]
    name_template: >-
      {{ "{{" }} .ProjectName {{ "}}" }}_
      {{ "{{" }}- title .Os {{ "}}" }}_
      {{ "{{" }}- if eq .Arch "amd64" {{ "}}" }}x86_64
      {{ "{{" }}- else if eq .Arch "386" {{ "}}" }}i386
      {{ "{{" }}- else {{ "}}" }}{{ "{{" }} .Arch {{ "}}" }}{{ "{{" }} end {{ "}}" }}
      {{ "{{" }}- if .Arm {{ "}}" }}v{{ "{{" }} .Arm {{ "}}" }}{{ "{{" }} end {{ "}}" }}

release:
  use_existing_draft: true
  replace_existing_artifacts: true
  make_latest: true
  # releaser-pleaser creates the Release (with its changelog) when the
  # Release PR/MR is merged; this job only attaches the build artefacts.
  mode: keep-existing

checksum:
  name_template: 'checksums.txt'

{{ if and .Signing.Enabled .Signing.KeyID -}}
# Release signing: gtb enable signing wired this. The signature over
# checksums.txt is what the self-updater's embedded trust anchor verifies.
# gtb is called directly (no shim); AWS credentials come from the CI OIDC
# context, and goreleaser runs with --skip=sign when there isn't one.
signs:
  - id: checksums
    cmd: gtb
    args:
      - "--ci"
      - "sign"
      - "--backend"
      - "{{ .Signing.Backend }}"
      {{- if eq .Signing.Backend "aws-kms" }}
      - "--kms-region"
      - "{{ .Signing.KMSRegion }}"
      {{- end }}
      - "--key-id"
      - "{{ .Signing.KeyID }}"
      - "--public-key"
      - "{{ .Signing.PublicKey }}"
      - "--output"
      - "${signature}"
      - "${artifact}"
    artifacts: checksum
    signature: "${artifact}.sig"
    output: true

{{ end -}}
snapshot:
  version_template: "{{ "{{" }} incpatch .Version {{ "}}" }}-dev{{ "{{" }}.ShortCommit{{ "}}" }}"

changelog:
  # releaser-pleaser owns the changelog and Release notes.
  disable: true

{{ if eq .ReleaseProvider "github" -}}
github_urls:
  api: https://{{ .Host }}/api/v3/
  upload: https://{{ .Host }}/api/uploads/
  download: https://{{ .Host }}/
  skip_tls_verify: false
{{ else -}}
gitlab_urls:
  api: https://{{ .Host }}/api/v4/
  download: https://{{ .Host }}/
  skip_tls_verify: false
{{ end -}}