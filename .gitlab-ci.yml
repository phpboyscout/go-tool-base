# .gitlab-ci.yml — pipeline assembled from phpboyscout/cicd components.
#
#   merge_request_event → lint, test, security        (the merge gate)
#   tag v*.*.*          → goreleaser, pages docs       (the release fan-out)
#   default branch      → releaser-pleaser, zensical-pages deploy
#   schedule            → renovate
#
# Quality gates live exclusively at the MR level — pushing to main runs
# nothing except releaser-pleaser (which itself opens an MR that gets
# the full gate), so by the time anything lands on main it has already
# been vetted. Goreleaser and the zensical-pages deploy both fire from
# the tag releaser-pleaser cuts when its Release MR merges, which means
# the docs site always corresponds to a real tagged release.
#
# Project setting prerequisites:
#   • Pipelines must succeed (so MR gates actually block merge)
#   • Merge method: fast-forward + squash (so the tested commit is what
#     lands on main)
#
# Components pinned to phpboyscout/cicd v0.10.1; Renovate (also via
# this pipeline) keeps the pins current via the cicd preset extended in
# renovate.json.

include:
  # Quality gates — MR-only by default. Go toolchain images bumped to
  # 1.26.4 to clear stdlib advisories GO-2026-5037 / GO-2026-5039
  # (cicd component defaults are 1.26.3; override here until cicd ships
  # v0.10.2 with the bump baked in).
  - component: gitlab.com/phpboyscout/cicd/go-lint@v0.10.1
    # golangci-lint image bundles its own Go; v2.12.2 ships 1.26.x and
    # is fine — no override needed here.
  - component: gitlab.com/phpboyscout/cicd/go-test@v0.10.1
    inputs:
      image: golang:1.26.4-bookworm
      enable_e2e: true
  - component: gitlab.com/phpboyscout/cicd/go-security@v0.10.1
    inputs:
      govulncheck_image: golang:1.26.4-bookworm

  # Release — tag-gated goreleaser + main-branch zensical-pages deploy.
  # goreleaser/goreleaser:v2.16.0 still bundles Go 1.26.3, but go.mod
  # now requires `toolchain go1.26.4`; pin GOTOOLCHAIN to that exact
  # version so the runner fetches the matching toolchain rather than
  # failing on the older bundled one. Revert to `local` (the component
  # default) once a goreleaser image ships Go 1.26.4. Note: this
  # restores the sum.golang.org dependency that v0.5.0 first tripped on
  # via a transient IPv6 routing issue on a shared runner.
  - component: gitlab.com/phpboyscout/cicd/goreleaser@v0.10.1
    inputs:
      gotoolchain: go1.26.4
  - component: gitlab.com/phpboyscout/cicd/zensical-pages@v0.10.1

  # Release MR machinery (external).
  - component: $CI_SERVER_FQDN/apricote/releaser-pleaser/run@v0.8.0
    inputs:
      token: $RELEASER_PLEASER_TOKEN
      branch: main
      stage: release

  # Scheduled Renovate run — wires its own schedule gate
  # ($RENOVATE_TASK=scan); the cicd preset (extended in renovate.json)
  # carries the custom manager that auto-bumps the pins above.
  - component: gitlab.com/phpboyscout/cicd/renovate-self@v0.10.1
    inputs:
      repositories: '["phpboyscout/go-tool-base"]'

stages:
  - lint
  - test
  - security
  - release
  - pages
  - renovate

# Pipeline-source gating: MR pipelines are primary; tag pipelines run
# the release fan-out; main pipelines exist only so releaser-pleaser
# can maintain its MR. The `never` rule suppresses duplicate branch
# pipelines when a feature branch already has an open MR (otherwise
# every push to a branch with an open MR would build twice).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

variables:
  # releaser-pleaser + goreleaser walk the full commit history.
  GIT_DEPTH: "0"

default:
  tags: [saas-linux-medium-amd64]
