# .gitlab-ci.yml — pipeline split by trigger:
#
#   merge_request_event → lint, test, security      (the merge gate)
#   tag v*.*.*          → goreleaser, pages docs    (the release fan-out)
#   default branch      → releaser-pleaser only     (manages the Release MR)
#   schedule            → renovate
#
# Quality gates live exclusively at the MR level — pushing to main runs
# nothing except releaser-pleaser (which itself opens an MR that gets the
# full gate), so by the time anything lands on main it has already been
# vetted. Goreleaser and the docs publish both trigger on the tag
# releaser-pleaser cuts when its Release MR merges, which means the docs
# site always reflects a tagged release.
#
# Project setting prerequisites:
#   • Pipelines must succeed (so MR gates actually block merge)
#   • Merge method: fast-forward + squash (so the tested commit is what
#     lands on main)

include:
  - component: $CI_SERVER_FQDN/apricote/releaser-pleaser/run@v0.8.0
    inputs:
      token: $RELEASER_PLEASER_TOKEN
      branch: main
      stage: release # reuse the existing stage; component default is "build"

stages:
  - lint
  - test
  - security
  - release
  - docs
  - renovate

# Pipeline-source gating: MR pipelines are primary; tag pipelines run
# the release fan-out; main pipelines exist only so releaser-pleaser can
# maintain its MR. The `never` rule suppresses duplicate branch
# pipelines when a feature branch already has an open MR (otherwise
# every push to a branch with an open MR would build twice).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

variables:
  GO_VERSION: "1.26.3"
  GIT_DEPTH: "0" # releaser-pleaser + goreleaser need the full history
  # CGO is left at the toolchain default (=1 on Linux) because the
  # race detector requires it. The goreleaser build block in
  # .goreleaser.yaml sets CGO_ENABLED=0 explicitly per artefact.

default:
  image: golang:${GO_VERSION}-bookworm
  tags: [saas-linux-medium-amd64]

# Cache Go module downloads + build cache across jobs in a pipeline.
.go-cache: &go-cache
  cache:
    key:
      files: [go.sum]
    paths:
      - .go/pkg/mod/
      - .go/cache/
    policy: pull-push
  before_script:
    - export GOPATH="${CI_PROJECT_DIR}/.go"
    - export GOCACHE="${CI_PROJECT_DIR}/.go/cache"
    - mkdir -p "${GOPATH}/pkg/mod" "${GOCACHE}"
    - go env GOPATH GOCACHE

# Reusable rule: run only on merge_request_event pipelines. Every quality
# gate (lint, test, security) uses this so we never re-run them on the
# default branch or on tag pipelines.
.mr-only: &mr-only
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ---------- lint stage ----------

lint:
  stage: lint
  # Pin to a release built with go1.26+ to match go.mod. v2.6.0 was
  # built with go1.25 and refused to load the config.
  image: golangci/golangci-lint:v2.12.2
  <<: [*go-cache, *mr-only]
  script:
    - golangci-lint run --timeout=30m

# ---------- test stage ----------

tests:
  stage: test
  <<: [*go-cache, *mr-only]
  script:
    - go test -race -coverprofile=cover.out ./...
    - go tool cover -func=cover.out | tail -1
  # GitLab's coverage badge is driven by this regex against the job log.
  # The badge reflects the latest successful run on the default branch by
  # default, but since tests now only run on MR pipelines we accept that
  # the badge tracks the most-recent merged-MR pipeline instead.
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - cover.out

e2e-bdd-tests:
  stage: test
  <<: [*go-cache, *mr-only]
  variables:
    INT_TEST_E2E: "1"
  script:
    - go test ./test/e2e/... -v -timeout 5m

# ---------- security stage ----------

govulncheck:
  stage: security
  <<: [*go-cache, *mr-only]
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - "$GOPATH/bin/govulncheck ./..."

trivy:
  stage: security
  image:
    name: aquasec/trivy:0.70.0
    entrypoint: [""]
  <<: *mr-only
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --no-progress .

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  <<: *mr-only
  script:
    - gitleaks detect --source . --verbose --redact

osv-scanner:
  stage: security
  image:
    name: ghcr.io/google/osv-scanner:v2.3.8
    entrypoint: [""]
  <<: *mr-only
  script:
    - /osv-scanner -L go.mod

# CodeQL on GitLab requires Ultimate; semgrep is the practical OSS
# equivalent for the same coverage tier. Keep job name `analyze` so
# downstream dashboards keying off the GitHub name still match.
analyze:
  stage: security
  image:
    name: returntocorp/semgrep:1.163.0
    entrypoint: [""]
  <<: *mr-only
  script:
    - semgrep --config p/golang --error --severity ERROR .

# ---------- release stage ----------

# The release MR is managed by the releaser-pleaser CI/CD component
# (see the `include:` near the top of this file). It runs only on the
# default branch and reads commit history to maintain the MR; the MR
# pipeline that gets triggered when the component updates its branch
# carries the full quality-gate suite via the .mr-only rules above.

# GoReleaser builds + publishes artefacts. Triggered by the tag
# releaser-pleaser creates when its Release MR is merged. GoReleaser
# attaches binaries to the Release that releaser-pleaser already created
# (release.mode: keep-existing in .goreleaser.yaml) and uses GitLab's
# package registry (`gitlab_urls.use_package_registry: true`) so no
# external storage is needed.
goreleaser:
  stage: release
  image:
    name: goreleaser/goreleaser:v2.16.0
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  variables:
    GIT_STRATEGY: clone
    # goreleaser/goreleaser:v2.16.0 ships with golang:1.26.3-alpine, which
    # already satisfies go.mod's `toolchain go1.26.3` directive. Pin
    # GOTOOLCHAIN=local so the runner never attempts a sum.golang.org
    # download — the v0.5.0 release first failed because that download
    # tripped on a transient IPv6 routing issue on a shared runner.
    GOTOOLCHAIN: local
  script:
    - goreleaser release --clean

# ---------- docs stage ----------

# Publishes the docs site to GitLab Pages from the freshly-tagged release
# tree, so the published site always corresponds to a real version. The
# stage runs after `release` (goreleaser) in the same tag pipeline,
# meaning the site reflects whatever changes shipped in the new tag and
# never publishes mid-release in-progress work.
pages:
  stage: docs
  image: python:3.14-bookworm
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  script:
    - pip install --require-hashes -r requirements-lock.txt
    - zensical build --clean
    - mv site public
  artifacts:
    paths:
      - public

# ---------- renovate stage ----------

# Self-hosted Renovate runner. Scheduled via the GitLab CI/CD →
# Schedules UI (recommend daily at 03:00 UTC). The schedule variable
# RENOVATE_TOKEN must be a project access token with api +
# write_repository scope. See renovate.json for the policy
# (auto-merge patch/minor, draft MR for majors, security bumps
# always auto-merge).
renovate:
  stage: renovate
  image:
    name: renovate/renovate:38
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_TASK == "scan"'
  variables:
    LOG_LEVEL: info
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: https://gitlab.com/api/v4/
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: '["phpboyscout/go-tool-base"]'
  script:
    - renovate
