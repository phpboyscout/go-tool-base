# .gitlab-ci.yml — pipeline translating the eight .github/workflows/*.yaml
# entries into the GitLab equivalent. Stages run sequentially; jobs
# within a stage run in parallel. The same blocking checks apply as the
# previous GitHub setup: lint, tests, e2e, govulncheck, trivy, gitleaks,
# osv-scanner, codeql-equivalent (semgrep) before docs+release.

# releaser-pleaser drives the release workflow via the Release-MR
# pattern: on main it opens/updates a "Release" MR with the pending
# changelog + version bump; merging that MR creates the tag and GitLab
# Release, which triggers the `goreleaser` job below to attach binaries.
# Distributed as a GitLab CI/CD component (no floating tags — pin the
# full version): https://gitlab.com/explore/catalog/apricote/releaser-pleaser
# Requires the RELEASER_PLEASER_TOKEN CI variable (project access token,
# Maintainer role, scopes: api, read_repository, write_repository).
include:
  - component: $CI_SERVER_FQDN/apricote/releaser-pleaser/run@v0.8.0
    inputs:
      token: $RELEASER_PLEASER_TOKEN
      branch: main
      stage: release # reuse the existing stage; component default is "build"

stages:
  - lint
  - test
  - security
  - docs
  - release
  - renovate

variables:
  GO_VERSION: "1.26.3"
  GIT_DEPTH: "0" # releaser-pleaser + goreleaser need the full history
  # CGO is left at the toolchain default (=1 on Linux) because the
  # race detector requires it. The goreleaser build block in
  # .goreleaser.yaml sets CGO_ENABLED=0 explicitly per artefact.

default:
  image: golang:${GO_VERSION}-bookworm
  tags: [saas-linux-medium-amd64]

# Cache Go module downloads + build cache across jobs in a pipeline.
.go-cache: &go-cache
  cache:
    key:
      files: [go.sum]
    paths:
      - .go/pkg/mod/
      - .go/cache/
    policy: pull-push
  before_script:
    - export GOPATH="${CI_PROJECT_DIR}/.go"
    - export GOCACHE="${CI_PROJECT_DIR}/.go/cache"
    - mkdir -p "${GOPATH}/pkg/mod" "${GOCACHE}"
    - go env GOPATH GOCACHE

# ---------- lint stage ----------

lint:
  stage: lint
  # Pin to a release built with go1.26+ to match go.mod. v2.6.0 was
  # built with go1.25 and refused to load the config.
  image: golangci/golangci-lint:v2.12.2
  <<: *go-cache
  script:
    - golangci-lint run --timeout=30m

# ---------- test stage ----------

tests:
  stage: test
  <<: *go-cache
  script:
    - go test -race -coverprofile=cover.out ./...
    - go tool cover -func=cover.out | tail -1
  # GitLab's coverage badge is driven entirely by this regex against
  # the job log. The Cobertura coverage_report block was removed
  # because the script produced cover.out (Go profile) but not
  # cover.xml — the missing-file error from the artifact upload
  # bubbled up and marked otherwise-passing pipelines as failed.
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - cover.out

e2e-bdd-tests:
  stage: test
  <<: *go-cache
  variables:
    INT_TEST_E2E: "1"
  script:
    - go test ./test/e2e/... -v -timeout 5m

# ---------- security stage ----------

govulncheck:
  stage: security
  <<: *go-cache
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - "$GOPATH/bin/govulncheck ./..."

trivy:
  stage: security
  image:
    name: aquasec/trivy:0.70.0
    entrypoint: [""]
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --no-progress .

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact

osv-scanner:
  stage: security
  image:
    name: ghcr.io/google/osv-scanner:v2.3.8
    entrypoint: [""]
  script:
    - /osv-scanner -L go.mod

# CodeQL on GitLab requires Ultimate; semgrep is the practical OSS
# equivalent for the same coverage tier. Keep job name `analyze` so
# downstream dashboards keying off the GitHub name still match.
analyze:
  stage: security
  image:
    name: returntocorp/semgrep:1.163.0
    entrypoint: [""]
  script:
    - semgrep --config p/golang --error --severity ERROR .

# ---------- docs stage ----------

# Publishes the docs site to GitLab Pages. The previous GitHub Pages
# workflow used `zensical build` (a mkdocs-material alternative); we
# keep the same generator and rename its output directory `site/`
# into the `public/` path GitLab Pages serves from.
pages:
  stage: docs
  image: python:3.14-bookworm
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - pip install --require-hashes -r requirements-lock.txt
    - zensical build --clean
    - mv site public
  artifacts:
    paths:
      - public

# ---------- release stage ----------

# The release MR is managed by the releaser-pleaser CI/CD component
# (see the `include:` near the top of this file). It injects its own
# job into the `release` stage on main.

# GoReleaser builds + publishes artefacts. Triggered by the tag
# releaser-pleaser creates when its Release MR is merged. GoReleaser
# attaches binaries to the Release that releaser-pleaser already created
# (release.mode: keep-existing in .goreleaser.yaml) and uses GitLab's
# package registry (`gitlab_urls.use_package_registry: true`) so no
# external storage is needed.
goreleaser:
  stage: release
  image:
    name: goreleaser/goreleaser:v2.15.4
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  variables:
    GIT_STRATEGY: clone
    # goreleaser/goreleaser:v2.10.2 ships with go1.24, but go.mod
    # targets ≥1.26. GOTOOLCHAIN=auto tells the in-image go binary
    # to fetch + use the requested toolchain (1.26.3) automatically.
    GOTOOLCHAIN: auto
  script:
    - goreleaser release --clean

# ---------- renovate stage ----------

# Self-hosted Renovate runner. Scheduled via the GitLab CI/CD →
# Schedules UI (recommend daily at 03:00 UTC). The schedule variable
# RENOVATE_TOKEN must be a project access token with api +
# write_repository scope. See renovate.json for the policy
# (auto-merge patch/minor, draft MR for majors, security bumps
# always auto-merge).
renovate:
  stage: renovate
  image:
    name: renovate/renovate:38
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_TASK == "scan"'
  variables:
    LOG_LEVEL: info
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: https://gitlab.com/api/v4/
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: '["phpboyscout/go-tool-base"]'
  script:
    - renovate
