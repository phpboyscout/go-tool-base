# .gitlab-ci.yml — pipeline assembled from phpboyscout/cicd components.
#
#   merge_request_event → lint, test, security        (the merge gate)
#   tag v*.*.*          → goreleaser, pages docs       (the release fan-out)
#   default branch      → releaser-pleaser, zensical-pages deploy
#   schedule            → renovate
#
# Quality gates live exclusively at the MR level — pushing to main runs
# nothing except releaser-pleaser (which itself opens an MR that gets
# the full gate), so by the time anything lands on main it has already
# been vetted. Goreleaser and the zensical-pages deploy both fire from
# the tag releaser-pleaser cuts when its Release MR merges, which means
# the docs site always corresponds to a real tagged release.
#
# Project setting prerequisites:
#   • Pipelines must succeed (so MR gates actually block merge)
#   • Merge method: fast-forward + squash (so the tested commit is what
#     lands on main)
#
# Components pinned to phpboyscout/cicd v0.11.1; Renovate (also via
# this pipeline) keeps the pins current via the cicd preset extended in
# renovate.json.

include:
  # Quality gates — MR-only by default. Toolchain + tools come from the
  # cicd dev-tools image baked into the components (Go 1.26.4, govulncheck,
  # golangci-lint) — no per-component image overrides needed since cicd
  # v0.14.0.
  - component: gitlab.com/phpboyscout/cicd/go-lint@v0.36.0
  - component: gitlab.com/phpboyscout/cicd/go-test@v0.36.0
    inputs:
      enable_e2e: true
      # The e2e generator scenarios scaffold projects and compile them against
      # go-tool-base's full dependency graph. After the 2026-06 dependency bump
      # (larger OTel/grpc/SDK trees) the cumulative build cost exceeds the 5m
      # default on the shared runner, so allow generous headroom.
      #
      # Raised 5m -> 15m -> 25m. The suite measured ~846s of scenario time
      # against the 15m ceiling, i.e. under a minute of headroom, and a
      # testcontainers bump tipped it over on a slower runner while an
      # otherwise identical pipeline passed. That is runner luck deciding
      # whether CI is green, which is worse than a slow job.
      #
      # This is headroom, not a licence for the suite to keep growing into it.
      # If a run approaches 25m, cut scenario cost rather than raising this
      # again: the previous rise was already absorbed within two months.
      e2e_timeout: "25m"
  - component: gitlab.com/phpboyscout/cicd/go-security@v0.36.0

  # Release — tag-gated goreleaser + main-branch zensical-pages deploy.
  # goreleaser runs on the dev-tools image (Go 1.26.4), so it builds with
  # the image's Go — no gotoolchain override needed (the component's
  # `auto` default applies harmlessly).
  #
  # --parallelism=1 serialises the 6 cross-compile targets. The default
  # (one build per CPU) compiles the large anthropic-sdk-go across several
  # targets at once, which OOM-kills the compiler on the shared runner
  # ("compile: signal: killed") and publishes zero assets. Sequential builds
  # cap peak memory at the cost of a longer release job.
  #
  # image: pinned explicitly because this release job needs `syft` on PATH —
  # goreleaser's sboms: stanza shells out to it. Originally pinned to v0.2.0,
  # the first tag that baked syft; it then sat there for five releases because
  # an image passed as a component INPUT is not a job-level `image:`, so
  # Renovate's gitlabci manager never saw it. The mirrored customManager in
  # renovate.json5 now tracks it (0065 D3/D4).
  - component: gitlab.com/phpboyscout/cicd/goreleaser@v0.36.0
    inputs:
      args: "release --clean --parallelism=1"
      image: "registry.gitlab.com/phpboyscout/images/dev-tools:v0.3.4"
  - component: gitlab.com/phpboyscout/cicd/zensical-pages@v0.36.0

  # Release MR machinery — our wrapper over apricote/releaser-pleaser
  # (carries the schedule-never guard, so it no longer fires on the
  # Renovate schedule).
  - component: gitlab.com/phpboyscout/cicd/releaser-pleaser@v0.36.0
    inputs:
      token: $RELEASER_PLEASER_TOKEN
      branch: main
      stage: release

  # Scheduled Renovate run — wires its own schedule gate
  # ($RENOVATE_TASK=scan); the cicd preset (extended in renovate.json)
  # carries the custom manager that auto-bumps the pins above.

  # Announce releases to the Discord announcements channel. Minor and
  # major cuts only by default; the webhook comes from the
  # DISCORD_RELEASE_WEBHOOK group variable, which is protected and so
  # reaches this job because `v*` is a protected tag here.
  - component: gitlab.com/phpboyscout/cicd/discord-release@v0.36.0
    inputs:
      # Headline project: patch releases are news here too.
      announce_patches: true

stages:
  - lint
  - test
  - security
  - release
  - notify
  - pages
  - renovate

# Pipeline-source gating: MR pipelines are primary; tag pipelines run
# the release fan-out; main pipelines exist only so releaser-pleaser
# can maintain its MR. The `never` rule suppresses duplicate branch
# pipelines when a feature branch already has an open MR (otherwise
# every push to a branch with an open MR would build twice).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

variables:
  # releaser-pleaser + goreleaser walk the full commit history.
  GIT_DEPTH: "0"

default:
  # Auto-retry transient shared-runner infrastructure failures. golangci-lint
  # (and occasionally the e2e job) intermittently dies with "Job failed (system
  # failure): context deadline exceeded" on the SaaS runners — a runner/scheduler
  # flake, not a real defect. This retries only infrastructure failure types;
  # script_failure (a genuine lint/test failure) is deliberately excluded so real
  # failures still fail fast. goreleaser keeps its own component-provided retry.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - api_failure

# ----------------------------------------------------------------------
# Phase 2 release-binary signing — overlay on the `goreleaser` job
# from the cicd component above.
#
# Goreleaser's `signs:` block invokes `scripts/sign-release.sh`, which
# shells out to `go run ./cmd/gtb sign --backend aws-kms`. The aws-kms
# backend uses the AWS SDK Go v2 default credential chain, which
# auto-resolves a role via web-identity OIDC when
# `AWS_WEB_IDENTITY_TOKEN_FILE` + `AWS_ROLE_ARN` are set — no aws-cli
# or `assume-role-with-web-identity` invocation needed.
#
# The signer IAM role (provisioned by terraform-aws-signing-kms) has a
# trust policy pinning it to
# `project_path:phpboyscout/go-tool-base:ref_type:tag:ref:v*`, so even
# if AWS_ROLE_ARN leaked, only this project's tag pipelines can assume
# it. The component's tag-gated `rules:` already restrict the job to
# release tags, so MR / branch / scheduled pipelines never reach the
# OIDC step.
#
# id_tokens: AWS_WEB_IDENTITY_TOKEN is injected by GitLab CI with
# `aud: https://gitlab.com`. We write it to a file the AWS SDK can
# read; this is the standard convention for AWS SDK Go v2 (the SDK
# refreshes the token from the file rather than reading the env var
# directly).
# ----------------------------------------------------------------------
goreleaser:
  # Transient-failure auto-retry (max 2, on script/runner/timeout failures —
  # originally added here after the v0.17.0 notarization timestamp dial-timeout
  # published zero assets) is now baked into the cicd goreleaser component
  # (>= v0.10.5, retry_max default 2), so no local retry: override is needed.
  id_tokens:
    AWS_WEB_IDENTITY_TOKEN:
      # The IAM OIDC provider (terraform-aws-bootstrap's automation-iam
      # module) hardcodes `client_id_list = ["sts.amazonaws.com"]`. AWS
      # rejects assume-role-with-web-identity unless the JWT's `aud`
      # claim is on that list — checked *before* the role's trust
      # policy condition runs.
      #
      # The signing-kms role's trust policy is matched to this value
      # via `oidc_audience = "sts.amazonaws.com"` in
      # infra/src/main.signing-kms.tf.
      aud: sts.amazonaws.com
  variables:
    AWS_REGION: eu-west-2
    AWS_ROLE_ARN: arn:aws:iam::049815585546:role/gtb-release-signing-v1-signer
    AWS_ROLE_SESSION_NAME: gtb-release-${CI_COMMIT_TAG}
    # --- Dual-sign overlap window (2026-07-24 key rotation) -----------
    # Secondary v2 key in the new prod account; sign-release.sh merges
    # its signature into the same checksums.txt.sig via `gtb sign
    # --append`, so in-field binaries (trusting only v1) and new
    # binaries (trusting v1+v2) both verify. DELETE these three
    # variables to close the window (see infra spec
    # 2026-07-24-prod-rebuild-and-rekey D2a/D5 — the old account may
    # only be closed after the window closes).
    GTB_SIGNING_KEY_ID_2: alias/gtb-release-signing-v2
    GTB_SIGNING_KEY_PUBLIC_2: internal/trustkeys/keys/signing-key-v2.asc
    AWS_ROLE_ARN_2: arn:aws:iam::060730976733:role/gtb-release-signing-v2-signer
    # AWS_WEB_IDENTITY_TOKEN_FILE must be in variables: (not just
    # exported in before_script) because GitLab runs each script entry
    # in its own shell — exports don't persist between steps.
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/oidc-token
  before_script:
    - echo "$AWS_WEB_IDENTITY_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"

# ----------------------------------------------------------------------
# Public-API diff — ADVISORY (non-blocking) while pre-1.0.
#
# GTB is currently v0.x. Per docs/reference/api-stability.md, breaking
# changes are *permitted* and ship as a MINOR bump during this phase, so
# a hard gate here would (correctly) reject legitimate, intentional
# breaks. This job therefore exists for VISIBILITY, not enforcement: it
# prints the public-API delta between the latest release tag and the MR's
# tree so a reviewer can see — and confirm as intentional — any API
# change. `scripts/apidiff.sh` always exits 0, and `allow_failure: true`
# is a belt-and-braces guard so this never blocks a merge.
#
# AT v1.0 THIS BECOMES A BLOCKING GATE: drop `allow_failure`, and have
# the job (or the script) fail on incompatible changes that lack a major
# version bump. Until then, keep it advisory.
#
# GIT_DEPTH is 0 globally (see variables: above), so the full tag history
# and the baseline tag's tree are available for the worktree comparison.
# osv-scanner — override the go-security component's script to disable the
# scanner's *own* embedded call-graph analysis.
#
# The osv-scanner image ships its own Go (1.26.2) and runs it with
# GOTOOLCHAIN=local, so it cannot load a module whose `go` directive is newer
# than that. Its call analysis then dies with:
#
#   Failed to run code analysis (govulncheck) ... go.mod requires go >= 1.26.5
#   (running go 1.26.2; GOTOOLCHAIN=local)
#
# That error has been present ever since our `go` directive outran the image,
# but it was invisible: osv-scanner exits 1 when it finds vulnerabilities, and
# it always found some. The moment the repo went clean the error surfaced as a
# bare exit 127 — a job rigged to fail precisely when it had nothing to report.
#
# We do not need osv-scanner's call analysis. `govulncheck` runs as its own job
# against the real toolchain and resolves call paths properly. osv-scanner's job
# here is the *module graph* (the broader, noisier question), and disabling call
# analysis makes it strictly more conservative, never less.
osv-scanner:
  script:
    - /osv-scanner --no-call-analysis=go -L go.mod

apidiff:
  stage: test
  image: golang:1.26.5-bookworm
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - ./scripts/apidiff.sh

# coverage-policy — advisory per-package ≥90% coverage check.
#
# Flags any countable package below the threshold in .coverage-policy.yaml that
# is not on the exclusion list (Bucket A/B of the coverage-gap-closure spec).
# Like `apidiff`, this is ADVISORY: `allow_failure: true` means a violation
# shows as a non-blocking warning, never gating a merge — so it can never flake
# the pipeline red. Its job is to stop packages silently slipping below 90%
# without being deliberately excluded. To clear a flag: add tests, or add the
# package to .coverage-policy.yaml `excluded:` with a rationale.
coverage-policy:
  stage: test
  image: golang:1.26.5-bookworm
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - ./scripts/coverage-policy.sh
