[project]
site_name = "Go Tool Base"
site_description = "The intelligent lifecycle framework for building Go CLI tools and applications"
site_author = "Matt Cockayne"
site_url = "https://gtb.phpboyscout.uk"
repo_url = "https://gitlab.com/phpboyscout/go-tool-base"
repo_name = "go-tool-base"
copyright = "Copyright &copy; 2026 Matt Cockayne"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/nav-specs.js"]
exclude_docs = "_template.md"

[project.theme]
custom_dir = "overrides"
logo = "images/branding/logo_transparent.svg"
favicon = "favicon.ico"
language = "en"
features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "header.autohide",
    # "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    #"navigation.prune",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
    "toc.integrate",
]

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"


[project.extra.status]
draft = "Draft"
DRAFT = "Draft"
in-review = "In Review"
IN-REVIEW = "In Review"
approved = "Approved"
APPROVED = "Approved"
in-progress = "In Progress"
IN-PROGRESS = "In Progress"
implemented = "Implemented"
IMPLEMENTED = "Implemented"
superseded = "Superseded"
SUPERSEDED = "Superseded"
rejected = "Rejected"
REJECTED = "Rejected"
deprecated = "Deprecated"
DEPRECATED = "Deprecated"

[[project.extra.social]]
icon = "fontawesome/brands/gitlab"
link = "https://gitlab.com/phpboyscout/go-tool-base"

[[project.extra.social]]
icon = "fontawesome/brands/mastodon"
link = "https://phpboyscout.uk"
