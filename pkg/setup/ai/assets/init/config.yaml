# AI provider configuration is written by the `init` wizard (or `init ai`),
# which records the chosen provider and — depending on the storage mode you
# select — an env-var reference, a keychain reference, or a literal key under
# the provider's block (e.g. anthropic.api.env / anthropic.api.keychain /
# anthropic.api.key). No keys are seeded here: an empty credential placeholder
# reads as "configured but blank" and would warn on every command.
