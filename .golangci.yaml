version: "2"
run:
  modules-download-mode: mod
  issues-exit-code: 1
  tests: true
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - cyclop
    - dupl
    - durationcheck
    - err113
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - godot
    - gosec
    - gosmopolitan
    - loggercheck
    - makezero
    - mnd
    - musttag
    - nestif
    - nilerr
    - nilnesserr
    - nlreturn
    - noctx
    - prealloc
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - whitespace
    - wsl_v5
    - zerologlint
  disable:
    - perfsprint
    - wrapcheck
    - wsl
  settings:
    exhaustive:
      # Treat a `default:` case as satisfying enum exhaustiveness.
      # Without this the linter forces enumeration of every enum value
      # (e.g. all 17 crypto.Hash constants) even when the default
      # already handles the unsupported set with a typed error —
      # noise without safety benefit.
      default-signifies-exhaustive: true
    gosmopolitan:
      allow-time-local: true
    revive:
      rules:
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
    rules:
      - path: _test\.go
        linters:
          - wsl_v5
          - nlreturn
          - whitespace
          - godot
          - err113
          - noctx
          - prealloc
          - unparam
          - mnd
          - dupl
      - path: _test\.go
        text: "G102|G112|G306"
        linters:
          - gosec
      # WKD wire format mandates SHA-1 as the local-part hash
      # (draft-koch-openpgp-webkey-service §3.1). It is not used for
      # cryptographic integrity; signature verification uses
      # ed25519/RSA via go-crypto.
      - path: pkg/setup/signing_wkd\.go
        text: "G401|G505"
        linters:
          - gosec
      # The agent's whole purpose is to run developer tooling (go build,
      # go test, go get, golangci-lint) inside an operator-sanctioned
      # working directory. G204 ("subprocess launched with variable") is
      # inherent to that contract — the command argv is constructed from
      # a fixed allow-list plus a validated package name (no leading '-',
      # restricted character class), never from raw model output. Scoped
      # to this one file rather than suppressed inline per the project's
      # "no //nolint" rule.
      - path: internal/agent/tools\.go
        text: "G204"
        linters:
          - gosec
      # gtb sign reads the operator-supplied --public-key / <input> paths
      # from the command line and filepath.Clean's them before opening.
      # G304 ("file inclusion via variable") is the expected shape of a
      # CLI that signs an operator-named artifact; a fixed path would
      # defeat the command. Scoped to the file instead of an inline
      # //nolint per the project rule.
      - path: internal/cmd/sign/sign\.go
        text: "G304"
        linters:
          - gosec
      # otelAuth in internal/cmd/root is a compile-time ldflags injection
      # target ("-X ...root.otelAuth=<base64>"); the Go linker can only
      # set package-level string vars, so gochecknoglobals is structurally
      # unavoidable here. Scoped to root.go rather than an inline
      # //nolint per the project rule.
      - path: internal/cmd/root/root\.go
        linters:
          - gochecknoglobals
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - gitlab.com/phpboyscout/go-tool-base
    gofumpt:
      module-path: gitlab.com/phpboyscout/go-tool-base
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

