version: "2"
run:
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - cyclop
    - dupl
    - durationcheck
    - err113
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - godot
    - gosec
    - gosmopolitan
    - loggercheck
    - makezero
    - mnd
    - musttag
    - nestif
    - nilerr
    - nilnesserr
    - nlreturn
    - noctx
    - nolintlint
    - prealloc
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - whitespace
    - wsl_v5
    - zerologlint
  disable:
    - perfsprint
    - wrapcheck
    - wsl
  settings:
    exhaustive:
      # Treat a `default:` case as satisfying enum exhaustiveness.
      # Without this the linter forces enumeration of every enum value
      # (e.g. all 17 crypto.Hash constants) even when the default
      # already handles the unsupported set with a typed error —
      # noise without safety benefit.
      default-signifies-exhaustive: true
    gosmopolitan:
      allow-time-local: true
    revive:
      rules:
        # cobra's RunE(cmd, args) signature is fixed, so those two names are
        # allowed unused; every other unused parameter is a vestige.
        - name: unused-parameter
          arguments:
            - allowRegex: "^(cmd|args)$"
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
    rules:
      - path: _test\.go
        linters:
          - wsl_v5
          - nlreturn
          - whitespace
          - godot
          - err113
          - noctx
          - prealloc
          - unparam
          - mnd
          - dupl
      - path: _test\.go
        text: "G102|G112|G306"
        linters:
          - gosec
      # A test fake implements a signature and rarely reads every parameter.
      - path: _test\.go
        text: "unused-parameter"
        linters:
          - revive
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - gitlab.com/phpboyscout/go-tool-base
    gofumpt:
      module-path: gitlab.com/phpboyscout/go-tool-base
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

